name: Bug report
description: Tell us about something that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve MAKO. Tell us what happened, and MAKO Wiz will guide you through any diagnostics we need.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Briefly describe the problem, including what you expected to happen instead.
    validations:
      required: true
