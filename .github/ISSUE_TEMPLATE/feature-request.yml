name: Feature request
description: Suggest an idea that would make MAKO better.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea for MAKO. A clear problem statement helps us evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us what is difficult or missing today.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or change you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any other solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, mock-ups, or other details that could help.
    validations:
      required: false
