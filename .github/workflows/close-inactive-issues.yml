name: MAKO Cleaner

on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  issues: write

concurrency:
  group: mako-cleaner
  cancel-in-progress: false

jobs:
  mako-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Close issues inactive for more than seven days
        uses: actions/github-script@v9
        with:
          script: |
            const inactiveForMs = 7 * 24 * 60 * 60 * 1000;
            const inactiveBefore = Date.now() - inactiveForMs;
            const mascotUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.repository.default_branch}/plugin/assets/mako-cleaner.webp`;
            const mascot = `<p align="center"><img src="${mascotUrl}" alt="MAKO Cleaner, a cyberpunk shark wearing a green police-style cap" width="160" /></p>`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'asc',
              per_page: 100,
            });

            let closed = 0;

            for (const issue of issues) {
              if (issue.pull_request || new Date(issue.updated_at).getTime() >= inactiveBefore) {
                continue;
              }

              const { data: currentIssue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });

              if (
                currentIssue.state !== 'open' ||
                currentIssue.pull_request ||
                new Date(currentIssue.updated_at).getTime() >= inactiveBefore
              ) {
                continue;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: currentIssue.number,
                body: [
                  '<!-- mako-cleaner-inactive-issue -->',
                  mascot,
                  '🧹 **MAKO Cleaner** here.',
                  'This issue was automatically closed because it has had no activity for more than seven days. Reply with new information if it should be reopened.',
                  '_This is an automated reply from MAKO Cleaner._',
                ].join('\n\n'),
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: currentIssue.number,
                state: 'closed',
              });

              closed += 1;
            }

            core.info(`Closed ${closed} inactive issue(s).`);
