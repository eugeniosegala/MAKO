name: MAKO Wiz diagnostics helper

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  reply-with-diagnostics-guide:
    name: Reply with diagnostics guide
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - name: Post the MAKO Wiz troubleshooting guide
        uses: actions/github-script@v9
        with:
          script: |
            const path = 'COLLECT_DIAGNOSTICS.md';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: context.payload.repository.default_branch,
            });

            if (Array.isArray(file) || file.type !== 'file') {
              throw new Error(`${path} is not a file.`);
            }

            const mascotUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.repository.default_branch}/plugin/assets/mako-wiz.webp`;
            const mascot = `<p align="center"><img src="${mascotUrl}" alt="MAKO Wiz, a cyberpunk shark wearing a wizard hat" width="160" /></p>`;
            const guide = Buffer.from(file.content, 'base64').toString('utf8').trim();
            const body = [
              '<!-- mako-wiz-diagnostics -->',
              mascot,
              '👋 **MAKO Wiz** here. Thanks for opening an issue!',
              'Please use the diagnostics guide below to collect the information needed to investigate this problem:',
              guide,
              '_This is an automated reply from MAKO Wiz._',
            ].join('\n\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
