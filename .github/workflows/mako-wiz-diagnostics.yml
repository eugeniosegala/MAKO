name: MAKO Wiz diagnostics helper

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  reply-with-diagnostics-guide:
    name: Reply with diagnostics guide
    runs-on: ubuntu-latest
    steps:
      - name: Post the MAKO Wiz troubleshooting guide
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            if (!issue.labels.some(({ name }) => name.toLowerCase() === 'bug')) {
              core.info('Skipping a non-bug issue.');
              return;
            }

            const path = 'COLLECT_DIAGNOSTICS.md';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: context.payload.repository.default_branch,
            });

            if (Array.isArray(file) || file.type !== 'file') {
              throw new Error(`${path} is not a file.`);
            }

            const mascotUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${context.payload.repository.default_branch}/plugin/assets/mako-wiz.webp`;
            const mascot = `<p align="center"><img src="${mascotUrl}" alt="MAKO Wiz, a cyberpunk shark wearing a wizard hat" width="160" /></p>`;
            // Relative document links must point to repository files from an issue comment.
            const guideUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${encodeURIComponent(context.payload.repository.default_branch)}/${path}`;
            const guide = Buffer.from(file.content, 'base64').toString('utf8').trim()
              .replace(/\]\(([^)\s]+)\)/g, (link, target) => {
                if (/^(?:[a-z][a-z\d+.-]*:|\/\/|#)/i.test(target)) {
                  return link;
                }
                return `](${new URL(target, guideUrl).href})`;
              });
            const body = [
              '<!-- mako-wiz-diagnostics -->',
              mascot,
              '👋 **MAKO Wiz** here. Thanks for opening an issue!',
              'Please use the diagnostics guide below to collect the information needed to investigate this problem:',
              guide,
              '_This is an automated reply from MAKO Wiz._',
              '---',
              '### ☕ Support MAKO',
              'Hey 👋 Are you enjoying MAKO? Donations keep it going. Your support funds development, bug fixes, GPU compute for training and evaluating models, and testing on real hardware.',
              [
                '<p align="center">',
                '  <a href="https://ko-fi.com/F0Q429XXET"><img src="https://raw.githubusercontent.com/eugeniosegala/MAKO/refs/heads/main/assets/kofi-button.svg" align="middle" hspace="4" alt="Support MAKO on Ko-fi" /></a>',
                '  <a href="https://github.com/eugeniosegala/MAKO/releases" target="_blank" rel="noopener noreferrer"><img src="https://img.shields.io/github/downloads/eugeniosegala/MAKO/total?style=flat&amp;label=total%20downloads&amp;color=0f766e" width="201" align="middle" hspace="4" alt="Total downloads across all MAKO Renderer and MAKO Decky release assets" /></a>',
                '</p>',
              ].join('\n'),
            ].join('\n\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
