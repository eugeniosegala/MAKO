name: SteamOS hardware validation

on:
  workflow_dispatch:
    inputs:
      gym_suites:
        description: Comma-separated affected MAKO Gym suites, or the explicit value none or all
        required: true
        type: string
      gym_reason:
        description: Short rationale for the selected and omitted MAKO Gym hardware coverage
        required: true
        type: string
      deploy_to_decky:
        description: Deploy the verified ZIP to an existing MAKO Decky test installation and reload it
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: steamos-hardware-validation
  cancel-in-progress: false

jobs:
  validate:
    name: AMD SteamOS release candidate
    runs-on: [self-hosted, linux, x64, steamos, amd-gpu]
    timeout-minutes: 120
    env:
      MAKO_STEAM_MACHINE: 1
      MAKO_GYM_SUITES: ${{ inputs.gym_suites }}
      MAKO_GYM_REASON: ${{ inputs.gym_reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure scoped cache and disposable work storage
        run: |
          ci_root="${MAKO_HARDWARE_CI_ROOT:-$GITHUB_WORKSPACE/engine/build/cache}"
          work_root="$RUNNER_TEMP/mako-build-work"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          required_kib="$((30 * 1024 * 1024))"
          if (( available_kib < required_kib )); then
            echo "SteamOS hardware validation needs at least 30 GiB free under $RUNNER_TEMP." >&2
            exit 1
          fi
          mkdir -p \
            "$ci_root" \
            "$ci_root/pnpm-store" \
            "$work_root/tmp" \
            "$work_root/flatpak"
          {
            echo "MAKO_HARDWARE_CI_ROOT=$ci_root"
            echo "MAKO_BUILD_CACHE_ROOT=$ci_root"
            echo "MAKO_BUILD_WORK_ROOT=$work_root"
            echo "MAKO_FLATPAK_CACHE_ROOT=$ci_root/flatpak"
            echo "MAKO_FLATPAK_TMP_ROOT=$work_root/flatpak"
            echo "TMPDIR=$work_root/tmp"
          } >> "$GITHUB_ENV"

      - name: Confirm dedicated hardware prerequisites
        run: |
          test "$(uname -s)" = Linux
          grep -qi '^ID=steamos' /etc/os-release
          grep -qi '0x1002' /sys/class/drm/renderD*/device/vendor
          for command in cmake ninja clang++ clang-cl g++ ld timeout vulkaninfo vkcube gamescope python3 flatpak flatpak-builder; do
            command -v "$command" >/dev/null || {
              echo "Required hardware-runner command is missing: $command" >&2
              exit 1
            }
          done
          command -v podman >/dev/null || command -v docker >/dev/null || {
            echo "Portable Qt 6.2 packaging requires Podman or Docker." >&2
            exit 1
          }
          gym_repo="${MAKO_GYM_REPO:-$GITHUB_WORKSPACE/../MAKO-Gym}"
          ./engine/scripts/run-mako-gym.sh \
            --gym-repo "$gym_repo" --require --all-suites --validate
          if [[ -n "$(git -C "$gym_repo" status --porcelain)" ]]; then
            echo "MAKO Gym must be clean for hardware validation: $gym_repo" >&2
            exit 1
          fi
          {
            echo "MAKO_GYM_REPO=$gym_repo"
            echo "MAKO_GYM_COMMIT=$(git -C "$gym_repo" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Record selected MAKO Gym hardware coverage
        run: >-
          ./scripts/validate-gym-selection.sh
          "$MAKO_GYM_SUITES"
          "$MAKO_GYM_REASON"
          engine/out/mako-gym-selection.txt

      - name: Install locked Decky dependencies
        working-directory: plugin
        run: >-
          pnpm install --frozen-lockfile
          --store-dir "$MAKO_HARDWARE_CI_ROOT/pnpm-store"

      - name: Record hardware and driver evidence
        run: ./scripts/collect-steamos-hardware-evidence.sh engine/out/hardware-validation.txt

      - name: Build the native Renderer and quality tool
        working-directory: engine
        run: >-
          MAKO_BUILD_DIR=build/hardware-validation
          ./scripts/build-steamos-dev.sh

      - name: Run MAKO Gym procedural render-quality matrix
        working-directory: engine
        run: |
          if [[ "$MAKO_GYM_SUITES" != all && ",${MAKO_GYM_SUITES}," != *",quality,"* ]]; then
            echo "MAKO Gym quality: not selected."
            exit 0
          fi
          ./scripts/run-mako-gym.sh --require --suite quality \
            --cli "$GITHUB_WORKSPACE/engine/build/hardware-validation/mako-cli/mako-cli" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-quality"
          mapfile -t quality_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-quality" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#quality_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO Gym quality result." >&2
            exit 1
          fi

      - name: Run MAKO Gym render-performance budgets
        working-directory: engine
        run: |
          if [[ "$MAKO_GYM_SUITES" != all && ",${MAKO_GYM_SUITES}," != *",performance,"* ]]; then
            echo "MAKO Gym performance: not selected."
            exit 0
          fi
          ./scripts/run-mako-gym.sh --require --suite performance \
            --cli "$GITHUB_WORKSPACE/engine/build/hardware-validation/mako-cli/mako-cli" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-performance"
          mapfile -t performance_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-performance" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#performance_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO Gym performance result." >&2
            exit 1
          fi

      - name: Run MAKO Gym spatial GPU-time budgets
        working-directory: engine
        run: |
          if [[ "$MAKO_GYM_SUITES" != all && ",${MAKO_GYM_SUITES}," != *",spatial-performance,"* ]]; then
            echo "MAKO Gym spatial-performance: not selected."
            exit 0
          fi
          ./scripts/run-mako-gym.sh --require --suite spatial-performance \
            --cli "$GITHUB_WORKSPACE/engine/build/hardware-validation/mako-cli/mako-cli" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-spatial-performance"
          mapfile -t spatial_performance_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-spatial-performance" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#spatial_performance_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO Gym spatial-performance result." >&2
            exit 1
          fi

      - name: Run MAKO Gym Vulkan synchronization validation
        working-directory: engine
        run: |
          if [[ "$MAKO_GYM_SUITES" != all && ",${MAKO_GYM_SUITES}," != *",sync-validation,"* ]]; then
            echo "MAKO Gym sync-validation: not selected."
            exit 0
          fi
          ./scripts/run-mako-gym.sh --require --suite sync-validation \
            --cli "$GITHUB_WORKSPACE/engine/build/hardware-validation/mako-cli/mako-cli" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-sync-validation"
          mapfile -t sync_validation_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-sync-validation" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#sync_validation_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO Gym synchronization-validation result." >&2
            exit 1
          fi

      - name: Run MAKO Gym quality-repeatability sentinels
        working-directory: engine
        run: |
          if [[ "$MAKO_GYM_SUITES" != all && ",${MAKO_GYM_SUITES}," != *",repeatability,"* ]]; then
            echo "MAKO Gym repeatability: not selected."
            exit 0
          fi
          ./scripts/run-mako-gym.sh --require --suite repeatability \
            --cli "$GITHUB_WORKSPACE/engine/build/hardware-validation/mako-cli/mako-cli" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-repeatability"
          mapfile -t repeatability_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-repeatability" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#repeatability_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO Gym repeatability result." >&2
            exit 1
          fi

      - name: Build and verify Renderer, Flatpaks, and the complete Decky ZIP
        id: package
        working-directory: plugin
        run: |
          version="$(tr -d '[:space:]' < ../engine/VERSION)"
          decky_archive="$PWD/out/MAKO-Decky-hardware-validated-v${version}.zip"
          MAKO_PORTABLE_PACKAGE=1 \
            ./scripts/package-local.sh \
            --local-engine-repo ../engine \
            "$decky_archive"
          echo "decky_archive=$decky_archive" >> "$GITHUB_OUTPUT"

      - name: Activate and exercise Decky's packaged Vulkan layer on the AMD GPU
        working-directory: engine
        run: |
          smoke_root="$(mktemp -d "${TMPDIR:-/tmp}/mako-decky-payload.XXXXXX")"
          trap 'rm -rf -- "$smoke_root"' EXIT
          unzip -q "${{ steps.package.outputs.decky_archive }}" \
            'Mako/bin/*-linux.tar.xz' -d "$smoke_root"
          mapfile -t renderer_archives < <(
            find "$smoke_root" -type f -name '*-linux.tar.xz' -print
          )
          if (( ${#renderer_archives[@]} != 1 )); then
            echo "Expected exactly one native Renderer archive in the Decky ZIP." >&2
            exit 1
          fi
          ./scripts/smoke-test-vulkan-layer.sh "${renderer_archives[0]}"
          matrix_prefix="$smoke_root/matrix-prefix"
          mkdir -p "$matrix_prefix"
          tar -xJf "${renderer_archives[0]}" -C "$matrix_prefix"

          gym_selected() {
            [[ "$MAKO_GYM_SUITES" == all || ",${MAKO_GYM_SUITES}," == *",$1,"* ]]
          }
          run_packaged_suite() {
            local suite="$1"
            local output_name="$2"
            shift 2
            if ! gym_selected "$suite"; then
              echo "MAKO Gym $suite: not selected."
              return 0
            fi
            local output_root="$GITHUB_WORKSPACE/engine/out/$output_name"
            ./scripts/run-mako-gym.sh --require --suite "$suite" \
              --launcher "$matrix_prefix/bin/mako-launch" \
              --output-root "$output_root" "$@"
            mapfile -t suite_markers < <(
              find "$output_root" -mindepth 2 -maxdepth 2 \
                -type f -name .sanitized -print
            )
            if (( ${#suite_markers[@]} != 1 )); then
              echo "Expected exactly one sanitized MAKO Gym $suite result." >&2
              exit 1
            fi
          }

          run_packaged_suite vulkan mako-gym
          run_packaged_suite recovery mako-gym-recovery
          run_packaged_suite external-recovery mako-gym-external-recovery
          run_packaged_suite gamescope-e2e mako-gym-gamescope-e2e
          run_packaged_suite sustained-health mako-gym-sustained-health
          run_packaged_suite proton-e2e mako-gym-proton-e2e
          run_packaged_suite proton-compatibility mako-gym-proton-compatibility \
            --runtime-tier extended --case-tier extended --minimum-runtimes 4
          run_packaged_suite runtime-overhead mako-gym-runtime-overhead

      - name: Deploy to the dedicated Decky test installation
        if: inputs.deploy_to_decky
        working-directory: plugin
        run: |
          python3 scripts/deploy-validated-package.py \
            "${{ steps.package.outputs.decky_archive }}"
          node scripts/activate-deployed-package.mjs

      - name: Retain the verified package, GPU comparisons, and sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: steamos-hardware-validation-${{ github.sha }}
          path: |
            engine/out/hardware-validation.txt
            engine/out/mako-gym-selection.txt
            engine/out/mako-gym-quality
            engine/out/mako-gym-performance
            engine/out/mako-gym-spatial-performance
            engine/out/mako-gym-runtime-overhead
            engine/out/mako-gym-sync-validation
            engine/out/mako-gym-repeatability
            engine/out/mako-gym
            engine/out/mako-gym-recovery
            engine/out/mako-gym-external-recovery
            engine/out/mako-gym-gamescope-e2e
            engine/out/mako-gym-sustained-health
            engine/out/mako-gym-proton-e2e
            engine/out/mako-gym-proton-compatibility
            plugin/out/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable hardware-validation data
        if: always()
        run: |
          case "$MAKO_BUILD_WORK_ROOT" in
            "$RUNNER_TEMP"/*)
              rm -rf --one-file-system -- "$MAKO_BUILD_WORK_ROOT"
              mkdir -p "$TMPDIR"
              ;;
            *)
              echo "Refusing to remove unexpected build-work path: $MAKO_BUILD_WORK_ROOT" >&2
              exit 1
              ;;
          esac
          rm -rf --one-file-system -- \
            "$GITHUB_WORKSPACE/engine/build/hardware-validation" \
            "$GITHUB_WORKSPACE/engine/out" \
            "$GITHUB_WORKSPACE/plugin/out" \
            "$GITHUB_WORKSPACE/plugin/dist" \
            "$GITHUB_WORKSPACE/plugin/coverage"
