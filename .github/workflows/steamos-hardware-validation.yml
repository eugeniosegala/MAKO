name: SteamOS hardware validation

on:
  workflow_dispatch:
    inputs:
      deploy_to_decky:
        description: Deploy the verified ZIP to an existing MAKO Decky test installation and reload it
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: steamos-hardware-validation
  cancel-in-progress: false

jobs:
  validate:
    name: AMD SteamOS release candidate
    runs-on: [self-hosted, linux, x64, steamos, amd-gpu]
    timeout-minutes: 120
    env:
      MAKO_STEAM_MACHINE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure scoped cache and disposable work storage
        run: |
          ci_root="${MAKO_HARDWARE_CI_ROOT:-$GITHUB_WORKSPACE/engine/build/cache}"
          work_root="$RUNNER_TEMP/mako-build-work"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          required_kib="$((30 * 1024 * 1024))"
          if (( available_kib < required_kib )); then
            echo "SteamOS hardware validation needs at least 30 GiB free under $RUNNER_TEMP." >&2
            exit 1
          fi
          mkdir -p \
            "$ci_root" \
            "$ci_root/pnpm-store" \
            "$work_root/tmp" \
            "$work_root/flatpak"
          {
            echo "MAKO_HARDWARE_CI_ROOT=$ci_root"
            echo "MAKO_BUILD_CACHE_ROOT=$ci_root"
            echo "MAKO_BUILD_WORK_ROOT=$work_root"
            echo "MAKO_FLATPAK_CACHE_ROOT=$ci_root/flatpak"
            echo "MAKO_FLATPAK_TMP_ROOT=$work_root/flatpak"
            echo "TMPDIR=$work_root/tmp"
          } >> "$GITHUB_ENV"

      - name: Confirm dedicated hardware prerequisites
        run: |
          test "$(uname -s)" = Linux
          grep -qi '^ID=steamos' /etc/os-release
          grep -qi '0x1002' /sys/class/drm/renderD*/device/vendor
          for command in cmake ninja clang++ g++ vulkaninfo vkcube gamescope python3 flatpak flatpak-builder; do
            command -v "$command" >/dev/null || {
              echo "Required hardware-runner command is missing: $command" >&2
              exit 1
            }
          done
          command -v podman >/dev/null || command -v docker >/dev/null || {
            echo "Portable Qt 6.2 packaging requires Podman or Docker." >&2
            exit 1
          }
          gym_repo="${MAKO_GYM_REPO:-$GITHUB_WORKSPACE/../MAKO-Gym}"
          ./engine/scripts/run-mako-gym.sh \
            --gym-repo "$gym_repo" --require --validate
          ./engine/scripts/run-mako-gym.sh \
            --gym-repo "$gym_repo" --require --suite recovery --validate
          if [[ -n "$(git -C "$gym_repo" status --porcelain)" ]]; then
            echo "MAKO-Gym must be clean for hardware validation: $gym_repo" >&2
            exit 1
          fi
          {
            echo "MAKO_GYM_REPO=$gym_repo"
            echo "MAKO_GYM_COMMIT=$(git -C "$gym_repo" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Install locked Decky dependencies
        working-directory: plugin
        run: >-
          pnpm install --frozen-lockfile
          --store-dir "$MAKO_HARDWARE_CI_ROOT/pnpm-store"

      - name: Record hardware and driver evidence
        run: ./scripts/collect-steamos-hardware-evidence.sh engine/out/hardware-validation.txt

      - name: Build the native Renderer and quality tool
        working-directory: engine
        run: >-
          MAKO_BUILD_DIR=build/hardware-validation
          ./scripts/build-steamos-dev.sh

      - name: Run MAKO-Gym procedural render-quality matrix
        working-directory: engine
        run: |
          ./scripts/run-mako-gym.sh --require --suite quality \
            --cli "$GITHUB_WORKSPACE/engine/build/hardware-validation/mako-cli/mako-cli" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-quality"
          mapfile -t quality_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-quality" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#quality_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO-Gym quality result." >&2
            exit 1
          fi

      - name: Build and verify Renderer, Flatpaks, and the complete Decky ZIP
        id: package
        working-directory: plugin
        run: |
          version="$(tr -d '[:space:]' < ../engine/VERSION)"
          decky_archive="$PWD/out/MAKO-Decky-hardware-validated-v${version}.zip"
          MAKO_PORTABLE_PACKAGE=1 \
            ./scripts/package-local.sh \
            --local-engine-repo ../engine \
            "$decky_archive"
          echo "decky_archive=$decky_archive" >> "$GITHUB_OUTPUT"

      - name: Activate and exercise Decky's packaged Vulkan layer on the AMD GPU
        working-directory: engine
        run: |
          smoke_root="$(mktemp -d "${TMPDIR:-/tmp}/mako-decky-payload.XXXXXX")"
          trap 'rm -rf -- "$smoke_root"' EXIT
          unzip -q "${{ steps.package.outputs.decky_archive }}" \
            'Mako/bin/*-linux.tar.xz' -d "$smoke_root"
          mapfile -t renderer_archives < <(
            find "$smoke_root" -type f -name '*-linux.tar.xz' -print
          )
          if (( ${#renderer_archives[@]} != 1 )); then
            echo "Expected exactly one native Renderer archive in the Decky ZIP." >&2
            exit 1
          fi
          ./scripts/smoke-test-vulkan-layer.sh "${renderer_archives[0]}"
          matrix_prefix="$smoke_root/matrix-prefix"
          mkdir -p "$matrix_prefix"
          tar -xJf "${renderer_archives[0]}" -C "$matrix_prefix"
          ./scripts/run-mako-gym.sh --require \
            --launcher "$matrix_prefix/bin/mako-launch" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym"
          mapfile -t gym_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#gym_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO-Gym result." >&2
            exit 1
          fi
          ./scripts/run-mako-gym.sh --require --suite recovery \
            --launcher "$matrix_prefix/bin/mako-launch" \
            --output-root "$GITHUB_WORKSPACE/engine/out/mako-gym-recovery"
          mapfile -t recovery_markers < <(
            find "$GITHUB_WORKSPACE/engine/out/mako-gym-recovery" \
              -mindepth 2 -maxdepth 2 -type f -name .sanitized -print
          )
          if (( ${#recovery_markers[@]} != 1 )); then
            echo "Expected exactly one sanitized MAKO-Gym recovery result." >&2
            exit 1
          fi

      - name: Deploy to the dedicated Decky test installation
        if: inputs.deploy_to_decky
        working-directory: plugin
        run: |
          python3 scripts/deploy-validated-package.py \
            "${{ steps.package.outputs.decky_archive }}"
          node scripts/activate-deployed-package.mjs

      - name: Retain the verified package, GPU comparisons, and sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: steamos-hardware-validation-${{ github.sha }}
          path: |
            engine/out/hardware-validation.txt
            engine/out/mako-gym-quality
            engine/out/mako-gym
            engine/out/mako-gym-recovery
            plugin/out/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable hardware-validation data
        if: always()
        run: |
          case "$MAKO_BUILD_WORK_ROOT" in
            "$RUNNER_TEMP"/*)
              rm -rf --one-file-system -- "$MAKO_BUILD_WORK_ROOT"
              mkdir -p "$TMPDIR"
              ;;
            *)
              echo "Refusing to remove unexpected build-work path: $MAKO_BUILD_WORK_ROOT" >&2
              exit 1
              ;;
          esac
          rm -rf --one-file-system -- \
            "$GITHUB_WORKSPACE/engine/build/hardware-validation" \
            "$GITHUB_WORKSPACE/engine/out" \
            "$GITHUB_WORKSPACE/plugin/out" \
            "$GITHUB_WORKSPACE/plugin/dist" \
            "$GITHUB_WORKSPACE/plugin/coverage"
