id: io.github.eugeniosegala.mako
command: mako-ui
default-branch: develop

runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-config

modules:
  - name: mako-ui
    buildsystem: cmake-ninja
    subdir: engine
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DMAKO_BUILD_VK_LAYER=OFF
      - -DMAKO_BUILD_UI=ON
      - -DMAKO_BUILD_CLI=OFF
      - -DMAKO_INSTALL_XDG_FILES=ON
    sources:
      - type: dir
        path: ../../../..
      - type: file
        path: io.github.eugeniosegala.mako.metainfo.xml
        dest: engine
      - type: shell
        commands:
          - install -Dm0644 io.github.eugeniosegala.mako.metainfo.xml -t /app/share/metainfo/
